<div class="min-h-screen bg-slate-50 font-sans flex antialiased text-slate-800">

  <!-- Backdrop para oscurecer en móviles cuando el sidebar está abierto -->
  <div 
    *ngIf="sidebarOpen" 
    (click)="closeSidebar()"
    class="fixed inset-0 z-20 bg-slate-900/40 backdrop-blur-xs lg:hidden transition-opacity">
  </div>

  <!-- Barra de Navegación Lateral (Sidenav Fijo) -->
  <app-sidebar 
    [isOpen]="sidebarOpen" 
    (closeSidebar)="closeSidebar()">
  </app-sidebar>

  <!-- ========================================================================= -->
  <!-- CONTENEDOR DERECHO: Header Delgado de Estado + Contenido Dinámico -->
  <!-- ========================================================================= -->
  <div class="flex-1 lg:ml-64 flex flex-col min-w-0 min-h-screen">

    <!-- Header Superior Delgado de Estado (h-16) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-xs h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8">
      
      <!-- Izquierda: Botón Hamburguesa Móvil + Título de Contexto -->
      <div class="flex items-center space-x-3">
        <!-- Botón Menú Móvil -->
        <button 
          (click)="toggleSidebar()" 
          class="lg:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors cursor-pointer"
          title="Abrir menú de navegación">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="flex items-center space-x-2">
          <div class="hidden sm:flex w-8 h-8 rounded-lg bg-[#004a8a]/10 items-center justify-center text-[#004a8a]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <div>
            <h2 class="text-xs sm:text-sm font-bold text-slate-900 leading-tight">Sistema de Gestión de Turnos</h2>
            <p class="text-[10px] text-slate-500 font-medium">Ministerio de Salud • Mendoza</p>
          </div>
        </div>
      </div>

      <!-- Derecha: Reloj en Vivo (Formato argentino) e indicador de estado -->
      <div class="flex items-center space-x-3 sm:space-x-4">
        <div class="flex flex-col text-right">
          <span class="text-xs font-mono font-bold text-slate-800">{{ horaActual }} hs</span>
          <span class="text-[10px] text-emerald-600 font-semibold flex items-center justify-end space-x-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Sistema Activo</span>
          </span>
        </div>
      </div>

    </header>

    <!-- Contenido Dinámico con Router Outlet -->
    <main class="flex-1 bg-slate-50 flex flex-col">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
